version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: sih_db
    environment:
      POSTGRES_DB: sih_airfare
      POSTGRES_USER: mospi_admin
      POSTGRES_PASSWORD: mospi_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mospi_admin -d sih_airfare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: sih_backend
    environment:
      DATABASE_URL: postgresql://mospi_admin:mospi_secure_password_2026@db:5432/sih_airfare
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATA_MODE: LIVE
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: sih_celery_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://mospi_admin:mospi_secure_password_2026@db:5432/sih_airfare
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DATA_MODE: LIVE
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sih_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
