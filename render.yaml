services:
  # FastAPI Web Service
  - type: web
    name: sih-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sih-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sih-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://your-vercel-domain.vercel.app,http://localhost:3000"
      - key: ENVIRONMENT
        value: "production"

  # Celery Worker
  - type: worker
    name: sih-celery-worker
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.core.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sih-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sih-redis
          property: connectionString
      - key: ENVIRONMENT
        value: "production"

databases:
  - name: sih-postgres
    plan: free
    ipAllowList: [] # empty means all allowed in Render, but better to lock down if needed

# Add a redis instance (if you have render paid plan, or use external)
# Note: Render does not have free Redis anymore, you must provision an external one like Upstash if on free tier.
# However, this config demonstrates how to wire it up if a Redis service exists.
