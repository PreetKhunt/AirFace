services:
  # FastAPI Web Service
  - type: web
    name: sih-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sih-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sih-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://your-vercel-domain.vercel.app,http://localhost:3000"
      - key: ENVIRONMENT
        value: "production"
        
  # Render Free Key Value (Redis-compatible)
  - type: redis
    name: sih-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Render Free PostgreSQL
  - name: sih-postgres
    plan: free
    ipAllowList: []
